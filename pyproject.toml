[project]
name = "aegisflow"
version = "0.1.0"
description = "A Deterministic State Harness & Fault-Tolerant Orchestrator for Multi-Agent AI Workflows"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "pydantic>=2.7.4",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=3.2,<4",
    "langchain>=0.2.6",
    "langchain-community>=0.2.6",
    "psycopg[binary]>=3.2.0",
    "docker>=7.1.0",
    "python-dotenv>=1.0.1",
    "websockets>=12.0",
    "sqlalchemy>=2.0.31",
    "httpx>=0.27",
    "tiktoken>=0.8",
    "pgvector>=0.3.6",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
models = ["sentence-transformers>=3.0"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live and not heavy'"
markers = [
    "live: makes calls to a real model provider (for example Groq)",
    "heavy: loads a local embedding or reranking model",
]
